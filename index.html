<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
    overflow: hidden;
}

/* CENTER */
.container {
    margin-top: 100px;
}

/* TITLE */
h1 {
    font-size: 50px;
    color: pink;
}

/* BUTTON */
button {
    padding: 15px 25px;
    font-size: 18px;
    background: pink;
    border: none;
    cursor: pointer;
}

/* MESSAGE */
#letter {
    margin-top: 30px;
    font-size: 22px;
    display: none;
}

/* HEART STYLE */
.heart {
    position: fixed;
    bottom: -50px;
    font-size: 30px;
    animation: floatUp 4s linear infinite;
}

/* ANIMATION */
@keyframes floatUp {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>I LOVE YOU ❤️</h1>

    <button onclick="openLetter()">Click Me 💌</button>

    <div id="letter"></div>
</div>

<script>

/* MESSAGE FUNCTION */
function openLetter() {
    const letter = document.getElementById("letter");
    letter.style.display = "block";

    const message = "I made this just for you... I really like you ❤️";

    let i = 0;
    letter.innerHTML = "";

    function type() {
        if (i < message.length) {
            letter.innerHTML += message[i];
            i++;
            setTimeout(type, 40);
        }
    }

    type();
}

/* VERY OBVIOUS HEART ANIMATION */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 4000);
}

/* FASTER SPAWN SO YOU NOTICE */
setInterval(createHeart, 100);

</script>

</body>
</html>
