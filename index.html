<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #000000, #1a001a);
    color: white;
    font-family: Arial;
    text-align: center;
    overflow: hidden;
}

/* CENTER */
.container {
    margin-top: 100px;
}

/* TITLE */
h1 {
    font-size: 55px;
    color: #ff4d6d;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4d6d; }
    to { text-shadow: 0 0 40px #ff4d6d, 0 0 80px #ff4d6d; }
}

/* BUTTON */
button {
    padding: 15px 25px;
    font-size: 18px;
    background: #ff4d6d;
    border: none;
    border-radius: 25px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff1e4d;
}

/* MESSAGE BOX */
#letter {
    margin-top: 30px;
    font-size: 22px;
    display: none;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
}

/* BIG HEART */
.big-heart {
    font-size: 70px;
    margin: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.big-heart:hover {
    transform: scale(1.2);
}

/* SECRET MESSAGE */
#secret {
    display: none;
    font-size: 24px;
    margin-top: 20px;
    color: #ff9eb5;
}

/* FLOATING HEARTS */
.heart {
    position: fixed;
    bottom: -20px;
    color: #ff4d6d;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>I LOVE YOU ❤️</h1>

    <!-- BIG HEART -->
    <div class="big-heart" onclick="showSecret()">💖</div>

    <!-- BUTTON -->
    <button onclick="openLetter()">Click Me 💌</button>

    <!-- MESSAGE -->
    <div id="letter"></div>

    <!-- SECRET -->
    <div id="secret">🌹 You’re really special to me 🌹</div>
</div>

<script>

/* LETTER (typing effect - FIXED) */
function openLetter() {
    const letter = document.getElementById("letter");

    letter.style.display = "block";

    const message = "I made this just for you... You make my days better, my mood lighter, and honestly... I really like you ❤️";

    let i = 0;
    letter.innerHTML = "";

    function type() {
        if (i < message.length) {
            letter.innerHTML += message[i];
            i++;
            setTimeout(type, 40);
        }
    }

    type();
}

/* SECRET MESSAGE */
function showSecret() {
    document.getElementById("secret").style.display = "block";
}

/* FLOATING HEARTS BACKGROUND */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 25 + 15 + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 200);

/* CLICK ANYWHERE = HEART BURST */
document.addEventListener("click", function(e) {
    for (let i = 0; i < 5; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";

        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.position = "fixed";
        heart.style.fontSize = "20px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);
    }
});

</script>

</body>
</html>
