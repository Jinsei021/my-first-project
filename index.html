<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

h1{
    font-size:70px;
    color:#ff4d6d;
    letter-spacing:5px;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px #ff4d6d;}
    to{ text-shadow:0 0 30px #ff4d6d, 0 0 60px #ff4d6d;}
}

.typing{
    font-size:28px;
    color:white;
    margin-top:20px;
}

.heart{
    position:absolute;
    color:#ff4d6d;
    font-size:20px;
    animation: float 6s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>I LOVE YOU ❤️</h1>
    <div class="typing" id="text"></div>
</div>

<script>

const message = "You are the most beautiful part of my life.";
let i = 0;

function typing(){
    if(i < message.length){
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typing, 60);
    }
}

typing();

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = Math.random()*30 + 20 + "px";
    heart.style.animationDuration = Math.random()*3 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(createHeart,200);

</script>

</body>
</html>
