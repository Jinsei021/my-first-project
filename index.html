<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
}

/* CENTER */
.container {
    margin-top: 100px;
}

/* BUTTON */
button {
    padding: 15px 25px;
    font-size: 18px;
    background: pink;
    border: none;
    cursor: pointer;
}

/* MESSAGE BOX */
#letter {
    margin-top: 30px;
    font-size: 22px;
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>I LOVE YOU ❤️</h1>

    <button onclick="openLetter()">Click Me 💌</button>

    <div id="letter"></div>
</div>

<script>

function openLetter() {
    const letter = document.getElementById("letter");

    letter.style.display = "block";  // FORCE SHOW

    const message = "I made this just for you... I really like you ❤️";

    let i = 0;
    letter.innerHTML = ""; // CLEAR BEFORE TYPING

    function type() {
        if (i < message.length) {
            letter.innerHTML += message[i];
            i++;
            setTimeout(type, 50);
        }
    }

    type();
}

</script>

</body>
</html>
