<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Someone Special ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0b0b0b, #1a001a);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* CENTER CONTENT */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
}

/* TITLE */
h1 {
    font-size: 55px;
    color: #ff4d6d;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4d6d; }
    to { text-shadow: 0 0 40px #ff4d6d, 0 0 80px #ff4d6d; }
}

/* BUTTON */
button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 20px;
}

button:hover {
    transform: scale(1.1);
    background: #ff1e4d;
}

/* LETTER BOX */
.letter {
    display: none;
    margin-top: 30px;
    font-size: 20px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
}

/* HEARTS */
.heart {
    position: absolute;
    color: #ff4d6d;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}

/* BIG HEART */
.big-heart {
    font-size: 80px;
    cursor: pointer;
    transition: 0.3s;
}

.big-heart:hover {
    transform: scale(1.2);
}

/* SECRET MESSAGE */
.secret {
    display: none;
    font-size: 24px;
    margin-top: 20px;
    color: #ff9eb5;
}

</style>
</head>

<body>

<div class="container">
    <h1>I LOVE YOU ❤️</h1>

    <div class="big-heart" onclick="showSecret()">💖</div>

    <button onclick="openLetter()">Click Me 💌</button>

    <div class="letter" id="letter">
        <p id="messageText"></p>
    </div>

    <div class="secret" id="secret">
        🌹 Surprise... you're special to me 🌹
    </div>
</div>

<script>

/* FLOATING HEARTS BACKGROUND */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 25 + 20 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}
setInterval(createHeart, 150);


/* FIXED LETTER FUNCTION (WITH TYPING EFFECT) */
function openLetter() {
    const letter = document.getElementById("letter");
    const text = document.getElementById("messageText");

    letter.style.display = "block";

    const message = "From the moment I met you, something felt different. You make my world brighter, my days lighter, and my heart happier. I don’t know if this is the perfect way to say it... but I just want you to know — I really, really like you ❤️";

    let i = 0;
    text.innerHTML = "";

    function typeEffect() {
        if (i < message.length) {
            text.innerHTML += message.charAt(i);
            i++;
            setTimeout(typeEffect, 40);
        }
    }

    typeEffect();
}


/* SECRET MESSAGE */
function showSecret() {
    document.getElementById("secret").style.display = "block";
}


/* CLICK ANYWHERE HEART BURST */
document.addEventListener("click", function(e) {
    for (let i = 0; i < 5; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";

        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.position = "absolute";
        heart.style.fontSize = "20px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);
    }
});

</script>

</body>
</html>
